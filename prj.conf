# ----------------------------------------------------------------------------
# LR2021 USB <-> FLRC bridge firmware - Zephyr project configuration
# ----------------------------------------------------------------------------
# Target board : Seeed XIAO nRF54L15 (xiao_nrf54l15/nrf54l15/cpuapp)
# Radio shield  : Semtech LoRa Plus EVK (Wio-LR2021)
# ----------------------------------------------------------------------------
# Ported to Zephyr v4.3.0 + usp_zephyr v1.1.2-feature-202604. The base
# configuration mirrors the Semtech flrc_burst reference sample; the USB CDC
# ACM, heap, and stack options are specific to this bridge firmware.

# --------------------------- Build / optimization ---------------------------
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_SIZE_OPTIMIZATIONS=n

# ---------------------------- General / libc --------------------------------
CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_ASSERT=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n

# ---------------------------- Memory / stacks -------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=40960
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y

# ---------------------------- Hardware buses --------------------------------
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PINCTRL=y

# ---------------------------- Serial Communication --------------------------
# The XIAO nRF54L15 has no USB peripheral — its USB-C connector routes through
# an onboard USB-UART bridge to a hardware UART (uart20, the chosen console).
# The host <-> MCU wire protocol is plain UART at 115200 baud, NOT USB CDC ACM.
# The firmware's cdc_dev = DT_CHOSEN(zephyr_console) resolves to &uart20.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y

# ---------------------------- Transceiver driver ----------------------------
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
# Use the no-thread trigger (matches the Semtech flrc_burst reference sample
# on usp_zephyr v1.1.2-feature-202604). The radio callback runs in the context
# of whoever calls smtc_rac_run_engine() (the main superloop here).
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=n
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_NO_THREAD=y
CONFIG_LR20XX_HAL_SPI_BUFFER_MAX_LENGTH=520
CONFIG_SEMTECH_LR20XX=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_RAL_RALF=y

# ---------------------------- USP / RAC -------------------------------------
CONFIG_USP=y
CONFIG_USP_MAIN_THREAD=n

# ---------------------------- Optional / debug ------------------------------
CONFIG_WATCHDOG=n
CONFIG_PM_DEVICE=y
CONFIG_FLASH=y
