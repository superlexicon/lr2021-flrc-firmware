# ----------------------------------------------------------------------------
# LR2021 USB <-> FLRC bridge firmware - Zephyr project configuration
# ----------------------------------------------------------------------------
# Target board : Seeed XIAO nRF54L15 (xiao_nrf54l15_nrf54l15_cpuapp)
# Radio shield  : Semtech LoRa Plus EVK (Wio-LR2021)
# ----------------------------------------------------------------------------

# ---------------------------- General / libc --------------------------------
CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_NEWLIB_LIBC=y
CONFIG_ASSERT=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n

# ---------------------------- Memory / stacks -------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# ---------------------------- Hardware buses --------------------------------
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PINCTRL=y

# ---------------------------- Serial Communication --------------------------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

# ---------------------------- Transceiver driver ----------------------------
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y
CONFIG_LR20XX_HAL_SPI_BUFFER_MAX_LENGTH=520

# ---------------------------- USP / RAC -------------------------------------
CONFIG_USP=y
CONFIG_USP_MAIN_THREAD=n

# ---------------------------- Optional / debug ------------------------------
CONFIG_WATCHDOG=n
CONFIG_PM_DEVICE=y
CONFIG_FLASH=y
